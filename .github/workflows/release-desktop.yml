name: Release desktop apps

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-15
            args: --target aarch64-apple-darwin --bundles dmg
          - platform: macos-15-intel
            args: --target x86_64-apple-darwin --bundles dmg
          - platform: windows-latest
            args: --bundles nsis

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.platform, 'macos-') && (matrix.platform == 'macos-15-intel' && 'x86_64-apple-darwin' || 'aarch64-apple-darwin') || '' }}

      - name: Install dependencies
        run: npm ci

      - name: Build and upload installers
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: Mellow Pomodoro Timer v__VERSION__
          releaseBody: |
            ## v1.1.3

            - 집중 종료 이펙트 시간을 설정의 드래그 바로 조절할 수 있습니다.
            - 종료 이펙트가 끝날 때 자연스럽게 사라지는 전환 효과를 추가했습니다.
            - Windows 시스템 트레이를 지원합니다.
            - Windows 트레이 아이콘에 남은 분을 표시하고 툴팁에서 정확한 시간을 확인할 수 있습니다.
            - Windows에서 항상 위 표시, 알림, 전역 단축키와 백그라운드 실행을 지원합니다.

            macOS는 Apple Silicon과 Intel용 DMG를, Windows는 NSIS EXE 설치 파일을 제공합니다.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
